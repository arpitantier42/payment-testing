name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payment -d payment_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e '.[dev]'
      # REQ-017 / HLD NFR-003: the payment page artifact must carry no gateway secrets.
      - name: Secret scan of the payment page
        run: python -m payment_service.secret_scan web/public
      - name: Tests (SQLite)
        run: python -m pytest
      - name: Tests (Postgres)
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://payment:payment@localhost:5432/payment_test
      - name: Docker image builds
        run: docker build -t payment-service:ci .
